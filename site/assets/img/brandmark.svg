<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bm-title bm-desc">
  <title id="bm-title">TrueRise brandmark</title>
  <desc id="bm-desc">Rising sun over a horizon on a navy background.</desc>
  <rect width="96" height="96" rx="20" fill="#1B2735"/>
  <!-- horizon line -->
  <line x1="12" y1="62" x2="84" y2="62" stroke="#FBF8F2" stroke-width="2.5" stroke-linecap="round"/>
  <!-- rising-sun half-circle -->
  <path d="M 20 62 A 28 28 0 0 1 76 62" fill="#B66A3F"/>
  <!-- five tick marks below horizon -->
  <line x1="24" y1="68" x2="24" y2="73" stroke="#FBF8F2" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="68" x2="36" y2="73" stroke="#FBF8F2" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="68" x2="48" y2="73" stroke="#FBF8F2" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="68" x2="60" y2="73" stroke="#FBF8F2" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="68" x2="72" y2="73" stroke="#FBF8F2" stroke-width="2" stroke-linecap="round"/>
  <!-- soft arc above sun -->
  <path d="M 14 62 A 34 34 0 0 1 82 62" fill="none" stroke="#B1AC9F" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
